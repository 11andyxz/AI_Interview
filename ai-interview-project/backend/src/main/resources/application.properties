spring.application.name=ai-interview-backend
server.port=8080

# Database Configuration (云端MySQL)
spring.datasource.url=jdbc:mysql://104.197.94.13:3306/ai_interview?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=andy
spring.datasource.password=123456

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Explicitly disable open-in-view to avoid performance issues
spring.jpa.open-in-view=false

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.aiinterview=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
# Use DEBUG level only for development
# logging.level.com.aiinterview=DEBUG
# logging.level.org.hibernate.SQL=DEBUG

# Jackson / JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# OpenAI Configuration (API key now loaded from database)
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.key=${OPENAI_API_KEY:sk-dummy-key-for-testing}
openai.model=gpt-3.5-turbo
openai.temperature=0.7
openai.max-tokens=1000
openai.max-history-messages=10
openai.embedding.model=text-embedding-3-small

# JWT Configuration
# IMPORTANT: Set JWT_SECRET environment variable in production!
# Use: export JWT_SECRET=your-256-bit-secret-key
jwt.secret=${JWT_SECRET:default-secret-key-change-in-production-min-256-bits-recommended-use-environment-variable}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Redis Configuration
# Set redis.enabled=false to use InMemoryVectorStore (for Week 12 evaluation without Redis service)
redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Stripe Configuration (暂未启用，后续配置)
# stripe.api.key.secret=
# stripe.api.key.publishable=
# stripe.webhook.secret=

# Alipay Configuration (暂未启用，后续配置)
# alipay.app.id=
# alipay.merchant.private.key=
# alipay.alipay.public.key=
# alipay.gateway.url=https://openapi.alipay.com/gateway.do

# Interview Configuration
interview.duration.warning.threshold=7200
interview.duration.max=10800

# Subscription Configuration
subscription.trial.days=7
subscription.plan.pro.price=29.99
subscription.plan.pro.currency=USD

# WebSocket Configuration
websocket.endpoint=/ws
websocket.allowed-origins=http://localhost:3000

# Monitoring - Email Notifications
monitoring.email.enabled=false
monitoring.email.from=noreply@aiinterview.com
monitoring.email.to=admin@aiinterview.com

# Spring Mail Configuration (for production use)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Monitoring - Slack Notifications
monitoring.slack.enabled=false
monitoring.slack.webhook.url=${SLACK_WEBHOOK_URL:}

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus,info,env
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# Custom Metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# ML Observability Configuration
ml.observability.enabled=true
ml.observability.sampling-rate=0.1
ml.observability.alert-threshold=0.1

# ML RAG Configuration
ml.rag.enabled=true
ml.rag.top-k=5
ml.rag.use-hybrid-search=true
ml.rag.max-context-tokens=2048
ml.rag.relevance-threshold=0.5
ml.indexing.enabled=true
