spring.application.name=ai-interview-backend
server.port=8080

# Database Configuration (Aiven Cloud MySQL)
# NOTE: Replace with your actual database credentials in production
spring.datasource.url=jdbc:mysql://your-mysql-host.example.com:3306/ai_interview?sslMode=REQUIRED&verifyServerCertificate=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Explicitly disable open-in-view to avoid performance issues
spring.jpa.open-in-view=false

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.aiinterview=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
# Use DEBUG level only for development
# logging.level.com.aiinterview=DEBUG
# logging.level.org.hibernate.SQL=DEBUG

# Jackson / JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# OpenAI Configuration (API key now loaded from database)
openai.api.url=https://api.openai.com/v1
openai.model=gpt-3.5-turbo
openai.temperature=0.7
openai.max-tokens=1000
openai.max-history-messages=10

# JWT Configuration
# IMPORTANT: Set JWT_SECRET environment variable in production!
# Use: export JWT_SECRET=your-256-bit-secret-key
jwt.secret=${JWT_SECRET:default-secret-key-change-in-production-min-256-bits-recommended-use-environment-variable}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Redis Configuration - Disabled for testing
spring.cache.type=simple
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.password=
# spring.data.redis.database=0
# spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Stripe Configuration (暂未启用，后续配置)
# stripe.api.key.secret=
# stripe.api.key.publishable=
# stripe.webhook.secret=

# Alipay Configuration (暂未启用，后续配置)
# alipay.app.id=
# alipay.merchant.private.key=
# alipay.alipay.public.key=
# alipay.gateway.url=https://openapi.alipay.com/gateway.do

# Interview Configuration
interview.duration.warning.threshold=7200
interview.duration.max=10800

# ML Adaptive Interview Configuration
ml.adaptive.enabled=false
ml.adaptive.se-threshold=0.3
ml.adaptive.min-questions=8
ml.adaptive.max-questions=12

# ML Embedding & Semantic Search Configuration (Week 14)
ml.embedding.enabled=false
ml.embedding.cache-ttl-days=7
ml.embedding.batch-size=100

# ML NLP Feature Extraction & Scoring Configuration (Week 14)
ml.nlp.enabled=false
ml.nlp.feature-cache.enabled=true

# ML Outcome Prediction Configuration (Week 14)
ml.prediction.enabled=false
ml.prediction.early-stopping.enabled=false
ml.prediction.early-stopping.pass-threshold=0.95
ml.prediction.early-stopping.fail-threshold=0.05
ml.prediction.early-stopping.min-questions=5

# Week 17: Early-Stop Policy Rollout Configuration (P0 Task 2)
# Unified dual-threshold policy: 0.90 / 0.10, minimum 6 questions
ml.prediction.early-stopping.new-policy.enabled=false
ml.prediction.early-stopping.new-policy.pass-threshold=0.90
ml.prediction.early-stopping.new-policy.fail-threshold=0.10
ml.prediction.early-stopping.new-policy.min-questions=6
ml.prediction.early-stopping.stability-threshold=0.2

# Subscription Configuration
subscription.trial.days=7
subscription.plan.pro.price=29.99
subscription.plan.pro.currency=USD

# WebSocket Configuration
websocket.endpoint=/ws
websocket.allowed-origins=http://localhost:3000

# Actuator & Monitoring Configuration (Week 16)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Metrics Configuration
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=dev
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.90,0.95,0.99

