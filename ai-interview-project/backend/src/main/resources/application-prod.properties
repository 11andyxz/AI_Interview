# Production Configuration for AI Interview Application
# Copy this file and customize for your production environment

spring.application.name=ai-interview-backend

# Server Configuration
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Database Configuration - USE ENVIRONMENT VARIABLES IN PRODUCTION!
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ai_interview?useSSL=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration - Production settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# CORS Configuration - CUSTOMIZE FOR YOUR DOMAIN
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging - Production level
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.com.aiinterview=INFO
logging.level.org.springframework.jdbc=WARN
logging.level.org.hibernate.SQL=WARN

# Log to file in production
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson / JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# OpenAI Configuration - API key loaded from database
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=${OPENAI_MODEL:gpt-4}
openai.temperature=0.7
openai.max-tokens=2000
openai.max-history-messages=10
openai.question-generation.max-history-messages=3
openai.question-generation.max-answer-chars=360
openai.question-generation.max-tokens=240

# JWT Configuration - MUST USE ENVIRONMENT VARIABLE IN PRODUCTION!
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Stripe Configuration
stripe.api.key.secret=${STRIPE_SECRET_KEY:}
stripe.api.key.publishable=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# Alipay Configuration
alipay.app.id=${ALIPAY_APP_ID:}
alipay.merchant.private.key=${ALIPAY_MERCHANT_PRIVATE_KEY:}
alipay.alipay.public.key=${ALIPAY_PUBLIC_KEY:}
alipay.gateway.url=https://openapi.alipay.com/gateway.do

# Interview Configuration
interview.duration.warning.threshold=7200
interview.duration.max=10800

# Subscription Configuration
subscription.trial.days=7
subscription.plan.pro.price=29.99
subscription.plan.pro.currency=USD

# WebSocket Configuration
websocket.endpoint=/ws
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:https://yourdomain.com}

# =====================================================
# ML Features Configuration - Week 14/15
# =====================================================
# IMPORTANT: ML features are DISABLED by default in production
# Enable progressively after validation in staging environment
# Use environment variables to override for controlled rollout

# ML Adaptive Interview Configuration
ml.adaptive.enabled=${ML_ADAPTIVE_ENABLED:false}
ml.adaptive.se-threshold=${ML_ADAPTIVE_SE_THRESHOLD:0.3}
ml.adaptive.min-questions=${ML_ADAPTIVE_MIN_QUESTIONS:8}
ml.adaptive.max-questions=${ML_ADAPTIVE_MAX_QUESTIONS:12}
ml.adaptive.topic-diversity-weight=${ML_ADAPTIVE_TOPIC_DIVERSITY_WEIGHT:0.4}

# ML Embedding & Semantic Search Configuration (Week 14)
ml.embedding.enabled=${ML_EMBEDDING_ENABLED:false}
ml.embedding.cache-ttl-days=${ML_EMBEDDING_CACHE_TTL_DAYS:7}
ml.embedding.batch-size=${ML_EMBEDDING_BATCH_SIZE:100}

# ML NLP Feature Extraction & Scoring Configuration (Week 14)
ml.nlp.enabled=${ML_NLP_ENABLED:false}
ml.nlp.feature-cache.enabled=${ML_NLP_FEATURE_CACHE_ENABLED:true}

# ML Outcome Prediction Configuration (Week 14)
ml.prediction.enabled=${ML_PREDICTION_ENABLED:false}
ml.prediction.early-stopping.enabled=${ML_PREDICTION_EARLY_STOPPING_ENABLED:false}
ml.prediction.early-stopping.pass-threshold=${ML_PREDICTION_EARLY_STOPPING_PASS_THRESHOLD:0.95}
ml.prediction.early-stopping.fail-threshold=${ML_PREDICTION_EARLY_STOPPING_FAIL_THRESHOLD:0.05}
ml.prediction.early-stopping.min-questions=${ML_PREDICTION_EARLY_STOPPING_MIN_QUESTIONS:5}

# OpenAI Embedding Model Configuration (for ML features)
openai.model.embedding=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# =====================================================
# Production Monitoring and Observability
# =====================================================
# Enable actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=production

# Health check configuration
management.health.redis.enabled=true
management.health.db.enabled=true

# Actuator Configuration (for health checks and monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.simple.enabled=true
