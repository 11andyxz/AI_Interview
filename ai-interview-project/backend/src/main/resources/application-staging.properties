# Staging Environment Configuration
# Active profile: staging
# Usage: java -jar app.jar --spring.profiles.active=staging

spring.application.name=ai-interview-backend

# Server Configuration
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Database Configuration - Staging MySQL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://staging-db-host:3306/ai_interview_staging?useSSL=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool - Staging settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration - Staging (validate only, no auto-update)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Configuration - Enable for staging
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# CORS Configuration - Staging domain
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://staging.yourdomain.com}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging - Staging level (moderate verbosity for debugging)
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.aiinterview=DEBUG
logging.level.org.springframework.jdbc=WARN
logging.level.org.hibernate.SQL=WARN

# Log to file in staging
logging.file.name=${LOG_FILE_PATH:logs/application.log}
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ML Features - ENABLED for Staging Validation
# NOTE: Staging is used to validate ML features before production rollout
ml.adaptive.enabled=true
ml.adaptive.se-threshold=0.3
ml.adaptive.min-questions=8
ml.adaptive.max-questions=12
ml.adaptive.topic-diversity-weight=0.4

# ML Embedding & Semantic Search - ENABLED
ml.embedding.enabled=true
ml.embedding.cache-ttl-days=7
ml.embedding.batch-size=100

# ML NLP Feature Extraction & Scoring - ENABLED
ml.nlp.enabled=true
ml.nlp.feature-cache.enabled=true

# ML Outcome Prediction - ENABLED
ml.prediction.enabled=true
ml.prediction.early-stopping.enabled=true
ml.prediction.early-stopping.pass-threshold=0.95
ml.prediction.early-stopping.fail-threshold=0.05
ml.prediction.early-stopping.min-questions=5

# OpenAI Configuration - REQUIRED environment variables
openai.api.key=${OPENAI_API_KEY}
openai.model.chat=${OPENAI_CHAT_MODEL:gpt-4-turbo-preview}
openai.model.embedding=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# Redis Configuration - Staging cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# File Upload - Staging limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration - Use environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator - Enable for staging monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
