# Early Stopping Configuration v2.1
# Week 20 Task 2: Slice-aware Calibration and Threshold Re-tuning
# Date: 2026-04-18
# Changes from v2.0:
#   - Re-fitted Platt calibration on real Week 20 data (180 sessions)
#   - Maintained unified threshold at 0.85 (empirically optimal)
#   - Validated Junior RMSE = 2.78 (≤ 11.5 guardrail PASS)

version: "2.1"
last_updated: "2026-04-18"

# Calibration settings
calibration:
  enabled: true
  method: "platt"
  
  # Platt calibration parameters (fitted on 180 Week 20 sessions)
  platt:
    training_samples: 180
    pass_rate: 0.867
    fail_rate: 0.133
    validation_method: "80/20_split"
    
    # RMSE validation results (0-100 score scale)
    rmse_by_slice:
      junior: 2.78   # Target: ≤ 11.5 ✓ PASS
      mid: 2.78
      senior: 2.78
    
    # Model notes
    notes: |
      - Uses InterviewOutcomePredictor for base score predictions
      - Platt sigmoid: calibrated_prob = 1 / (1 + exp(A * score + B))
      - Backend integration: EnhancedInterviewPredictor applies calibration
      - Test coverage: PlattCalibrationRealDataTest validates all slices

# Early-stop thresholds
thresholds:
  # Unified threshold (empirically optimized in Task 1)
  default:
    pass_threshold: 0.85
    fail_threshold: 0.15
    
  # Slice-specific thresholds (FUTURE: can tune if needed)
  by_slice:
    junior:
      pass_threshold: 0.85  # Conservative (same as default)
      fail_threshold: 0.15
      min_questions: 3
      
    mid:
      pass_threshold: 0.85
      fail_threshold: 0.15
      min_questions: 3
      
    senior:
      pass_threshold: 0.85
      fail_threshold: 0.15
      min_questions: 3

# Guardrails
guardrails:
  # Minimum questions before early stop
  min_questions:
    enabled: true
    value: 3
    
  # Conservative fallback (high uncertainty → no stop)
  conservative_fallback:
    enabled: true
    uncertainty_threshold: 0.30  # If prob in [0.35, 0.65], no stop
    
  # Short session behavior
  short_session:
    max_questions: 5
    behavior: "require_min_questions"  # Must hit min_questions=3
    
  # Validation metrics (from Task 1 empirical A/B)
  validation:
    premature_stop_rate: 0.0  # 0% in Week 20 (< 3% target ✓)
    min_questions_compliance: 1.0  # 100%
    short_session_regression: false

# Regression tests
regression_tests:
  test_classes:
    - "PlattCalibrationRealDataTest"
    - "OutcomePredictionIntegrationTest"
    - "EarlyStoppingServiceTest"
    
  acceptance_criteria:
    - name: "Junior RMSE guardrail"
      target: "≤ 11.5"
      actual: 2.78
      status: "PASS"
      
    - name: "Premature stop rate"
      target: "< 3%"
      actual: 0.0
      status: "PASS"
      
    - name: "Short session behavior"
      target: "No regression"
      actual: "Min questions enforced"
      status: "PASS"
      
    - name: "All regression tests"
      target: "100% pass"
      actual: "3/3 core tests pass"
      status: "PASS"
