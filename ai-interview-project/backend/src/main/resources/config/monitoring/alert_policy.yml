---
# On-Call Rotation & Ownership

on_call_schedule:
  ml_on_call:
    rotation: "weekly"
    timezone: "America/Los_Angeles"
    primary: "ml_engineer_rotation"
    secondary: "ml_team_lead"
    coverage: "24/7"
    
    responsibilities:
      - "Respond to critical ML alerts within 10 minutes"
      - "Execute rollback procedures"
      - "Create incident tickets"
      - "Escalate to team lead if unsure"
  
  data_platform_on_call:
    rotation: "weekly"
    timezone: "America/Los_Angeles"
    primary: "data_engineer_rotation"
    secondary: "sre"
    coverage: "24/7"
    
    responsibilities:
      - "Maintain metrics pipeline health"
      - "Restore data collection within 30 minutes"
      - "Coordinate with ML team on data issues"

escalation_contacts:
  ml_team_lead:
    slack: "@ml_lead"
    phone: "+1-XXX-XXX-XXXX"
    availability: "Mon-Fri 9am-6pm PT, emergency anytime"
  
  engineering_manager:
    slack: "@eng_manager"
    phone: "+1-XXX-XXX-XXXX"
    escalation_threshold: "Severity=critical AND duration>30min"
  
  product_manager:
    slack: "@product"
    email: "product@company.com"
    notification_triggers: ["premature_stop_high", "efficiency_degradation"]

---
# Alert Notification Channels

channels:
  pagerduty:
    service: "ml_early_stop_service"
    integration_key: "${PAGERDUTY_INTEGRATION_KEY}"
    severity_routing:
      critical: "ml_on_call"
      warning: "ml_engineer_rotation"  # Non-paging notification
  
  slack:
    critical_channel: "#ml-alerts-critical"
    warning_channel: "#ml-alerts-warning"
    info_channel: "#ml-metrics"
    
    message_format: |
      🚨 **{{severity | upper}}**: {{alert_name}}
      
      **Metric**: {{metric_name}} = {{current_value}}
      **Threshold**: {{threshold}}
      **Duration**: {{duration}}
      
      **Action**: {{recommended_action}}
      **Runbook**: {{runbook_link}}
      **Owner**: @{{owner}}
  
  email:
    recipients:
      critical: ["ml-team@company.com", "oncall@company.com"]
      warning: ["ml-team@company.com"]
    
    subject_format: "[{{severity}}] {{alert_name}} - {{environment}}"
