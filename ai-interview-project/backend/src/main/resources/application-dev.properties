# Development Environment Configuration
# Active profile: dev
# Usage: java -jar app.jar --spring.profiles.active=dev

spring.application.name=ai-interview-backend

# Server Configuration
server.port=8080

# Database Configuration - Development MySQL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ai_interview_dev?useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool - Development settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA Configuration - Development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS Configuration - Allow localhost for development
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging - Development level (verbose)
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.aiinterview=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ML Features - ENABLED for Development Testing
ml.adaptive.enabled=true
ml.adaptive.se-threshold=0.3
ml.adaptive.min-questions=8
ml.adaptive.max-questions=12
ml.adaptive.topic-diversity-weight=0.4

# ML Embedding & Semantic Search - ENABLED
ml.embedding.enabled=true
ml.embedding.cache-ttl-days=7
ml.embedding.batch-size=100

# ML NLP Feature Extraction & Scoring - ENABLED
ml.nlp.enabled=true
ml.nlp.feature-cache.enabled=true

# ML Outcome Prediction - ENABLED
ml.prediction.enabled=true
ml.prediction.early-stopping.enabled=true
ml.prediction.early-stopping.pass-threshold=0.95
ml.prediction.early-stopping.fail-threshold=0.05
ml.prediction.early-stopping.min-questions=5

# OpenAI Configuration - Use environment variable
openai.api.key=${OPENAI_API_KEY:sk-test-key}
openai.model.chat=${OPENAI_CHAT_MODEL:gpt-4-turbo-preview}
openai.model.embedding=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# Development-specific settings
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# File Upload - Development limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration - Development token (short-lived for testing)
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}
